name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: self-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: bash version
        run: bash --version | head -1

      - name: self-tests
        run: bash tests/run.sh

      # macOS ships bash 3.2 as /bin/bash, and `#!/usr/bin/env bash` finds it whenever Homebrew's bash
      # is not on PATH — which is the operator's laptop, not this runner. Run the suite there too.
      - name: self-tests under bash 3.2
        if: runner.os == 'macOS'
        run: ADW_TEST_SHELL=/bin/bash bash tests/run.sh

  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail loudly if the runner image ever stops shipping it, rather than skipping the whole job.
      - name: shellcheck version
        run: shellcheck --version

      # -S warning is the floor the codebase currently holds at: 0 errors, 0 warnings. Below it sit 58
      # info and 58 style findings — mostly SC1091 (shellcheck cannot follow `source "$here/lib.sh"`)
      # and SC2086 on expansions that are split on purpose. Those need a decision per site, so they are
      # backlog, not a silenced rule.
      - name: shellcheck -S warning
        run: shellcheck -S warning -f gcc scripts/*.sh install.sh tests/run.sh tests/lib/*.sh tests/cases/*.sh
